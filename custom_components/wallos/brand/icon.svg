<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#0B2E7A"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#F2A413"/>
    </linearGradient>
    <clipPath id="cal"><rect x="96" y="116" width="260" height="270" rx="36"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- calendar -->
  <rect x="96" y="124" width="260" height="270" rx="36" fill="#000" opacity="0.18"/>
  <rect x="96" y="116" width="260" height="270" rx="36" fill="#FFFFFF"/>
  <g clip-path="url(#cal)">
    <rect x="96" y="116" width="260" height="80" fill="#FF6B5E"/>
  </g>
  <rect x="152" y="92" width="24" height="56" rx="12" fill="#DCE6FF"/>
  <rect x="276" y="92" width="24" height="56" rx="12" fill="#DCE6FF"/>

  <!-- calendar grid -->
  <g fill="#C9D8FF">
    <rect x="124" y="218" width="36" height="36" rx="9"/>
    <rect x="180" y="218" width="36" height="36" rx="9"/>
    <rect x="236" y="218" width="36" height="36" rx="9"/>
    <rect x="292" y="218" width="36" height="36" rx="9"/>
    <rect x="124" y="266" width="36" height="36" rx="9"/>
    <rect x="180" y="266" width="36" height="36" rx="9"/>
    <rect x="236" y="266" width="36" height="36" rx="9"/>
    <rect x="124" y="314" width="36" height="36" rx="9"/>
    <rect x="180" y="314" width="36" height="36" rx="9"/>
  </g>

  <!-- coin -->
  <circle cx="340" cy="348" r="96" fill="#000" opacity="0.22"/>
  <circle cx="336" cy="340" r="96" fill="url(#coin)" stroke="#E0900B" stroke-width="6"/>
  <circle cx="336" cy="340" r="72" fill="none" stroke="#FFF3B0" stroke-width="4" opacity="0.8"/>
  <polyline points="296,306 316,374 336,330 356,374 376,306"
            fill="none" stroke="#B8730A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
